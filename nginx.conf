server {
    # ${PORT} is substituted by nginx's envsubst-on-templates entrypoint at
    # startup (defaults to 80; override via the PORT env var, e.g. from compose).
    # $uri/$host below are left intact — envsubst only replaces real env vars.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is regenerated on every container start — never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Backend API, reverse-proxied so the SPA can call it same-origin
    # (API_BASE_URL=/api). The browser then always talks to whatever address it
    # loaded the page from — LAN IP, mDNS name, VPN, reverse-proxy domain — so
    # no CORS is involved and the backend port need not be published at all.
    # The upstream below is substituted from API_UPSTREAM, which defaults to the
    # compose service name (Dockerfile ENV) — note envsubst rewrites comments
    # too, so don't spell that variable out here.
    location /api/ {
        # Docker's embedded DNS, re-resolved periodically: going through a
        # variable defers resolution to request time, so recreating the backend
        # container (new IP) doesn't strand nginx on a stale address.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream ${API_UPSTREAM};

        # Strip the /api prefix. proxy_pass carries no URI of its own because
        # with a variable upstream nginx would forward that URI verbatim
        # instead of substituting the matched location prefix.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA deep-link fallback: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
